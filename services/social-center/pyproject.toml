[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maemorkratai-social-center"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local read-only social analytics for MaeMorKratai"

[tool.setuptools.packages.find]
include = ["maemorkratai*"]

[tool.setuptools.package-data]
maemorkratai = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
